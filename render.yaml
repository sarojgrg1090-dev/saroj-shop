# Setup file for Render.com (free hosting).
# On Render: New → Blueprint → choose this GitHub repo. Render reads this file.
services:
  - type: web
    name: saroj-shop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # Render asks you to type a password during setup (never put it in this file)
      - key: STRIPE_SECRET_KEY
        sync: false # your Stripe TEST secret key (sk_test_...) — optional, turns on card payments

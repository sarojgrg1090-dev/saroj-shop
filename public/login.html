<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <form class="login-box modal-box" id="loginForm">
    <div class="login-icon">🔒</div>
    <h3>Admin Login</h3>
    <label>Username <input type="text" name="username" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <p class="login-error" id="loginError" hidden></p>
    <button type="submit" class="btn full">Log In</button>
    <a href="/" class="back-link">← Back to shop</a>
  </form>

  <script src="login.js"></script>
</body>
</html>
